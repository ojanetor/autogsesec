name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autogsesec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autogsesec_test
      # A non-UTC session time zone, so time-zone bugs cannot hide behind UTC
      PGTZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - name: Build the schema with migrations, as production does, and check it matches the models
        env:
          APP_ENV: production
          SECRET_KEY: ci-only
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          flask --app app db upgrade
          flask --app app db check
      - run: python -m pytest -v
      
